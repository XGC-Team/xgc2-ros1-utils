name: ci

on:
  push:
    branches:
      - melodic
  pull_request:
    branches:
      - melodic
  workflow_dispatch:

jobs:
  cpp-quality:
    name: cpp-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ quality gate in Docker
        run: |
          docker pull ros:melodic-ros-base-bionic
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace/ros1-utils" \
            ros:melodic-ros-base-bionic \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                clang-format \
                clang-tidy \
                cmake \
                git \
                libeigen3-dev \
                rsync \
                ros-melodic-roscpp \
                ros-melodic-rospack

              cd /workspace/ros1-utils
              .xgc2/scripts/check_cpp_quality.sh --work-dir /tmp/ros1-utils-cpp-quality
            '

  build:
    name: package-tests-debs-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Run package compliance/tests and build deb package in Docker
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/ros1-utils-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-ros1-utils-debs-${{ matrix.arch }}
          path: debs/*.deb
