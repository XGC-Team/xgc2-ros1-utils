name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish debs to the APT repository
        required: true
        type: boolean
        default: false
      run_cpp_quality:
        description: Run C++ quality checks
        required: true
        type: boolean
        default: false
      run_source_tests:
        description: Run source tests
        required: true
        type: boolean
        default: false

jobs:
  release-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        run: |
          set -euo pipefail
          product_version="$(sed -n 's/^version:[[:space:]]*//p' .xgc2/product.yml | head -n 1)"
          if [[ "${product_version}" != "${{ inputs.expected_version }}" ]]; then
            echo "product.yml version ${product_version} != expected_version ${{ inputs.expected_version }}" >&2
            exit 1
          fi
          source_sha="$(git rev-parse HEAD)"
          if [[ "${source_sha}" != "${{ inputs.expected_source_sha }}" ]]; then
            echo "HEAD ${source_sha} != expected_source_sha ${{ inputs.expected_source_sha }}" >&2
            exit 1
          fi

  cpp-quality:
    if: ${{ inputs.run_cpp_quality }}
    name: cpp-quality
    needs: release-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run C++ quality gate in Docker
        run: |
          docker pull ros:melodic-ros-base-bionic
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace/ros1-utils" \
            ros:melodic-ros-base-bionic \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                clang-format \
                clang-tidy \
                cmake \
                git \
                libeigen3-dev \
                rsync \
                ros-melodic-roscpp \
                ros-melodic-rospack

              cd /workspace/ros1-utils
              .xgc2/scripts/check_cpp_quality.sh --work-dir /tmp/ros1-utils-cpp-quality
            '

  build:
    name: package-tests-debs-${{ matrix.arch }}
    needs: release-guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Run package compliance/tests and build deb package in Docker
        run: |
          args=(
            --work-dir "$RUNNER_TEMP/ros1-utils-${{ matrix.arch }}"
            --output-dir "$GITHUB_WORKSPACE/debs"
          )
          if [[ "${{ inputs.run_source_tests }}" != "true" ]]; then
            echo "build_debs_in_docker.sh does not expose a switch to skip source tests; running existing package/test/deb path." >&2
          fi
          .xgc2/scripts/build_debs_in_docker.sh "${args[@]}"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-ros1-utils-debs-${{ matrix.arch }}
          path: debs/*.deb

      - name: Publish to self-hosted APT repository
        if: ${{ inputs.publish_apt && env.APT_REPO_HOST != '' && env.APT_REPO_PORT != '' && env.APT_REPO_SSH_KEY != '' && env.APT_REPO_KNOWN_HOSTS != '' }}
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir debs
