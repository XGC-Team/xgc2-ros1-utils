schema: xgc2.product.v1
id: xgc2-ros1-utils
name: XGC2 ROS1 Utils
version: 1.1.1-1
kind: ros1-apt
summary: ROS1-coupled parameter, namespace, and topic quality helpers for XGC2 runtime
  packages.
ros:
  distro: melodic
  packages:
  - ros1_utils
apt:
  distribution: bionic
  install:
  - ros-melodic-xgc2-ros1-utils
  packages:
  - ros-melodic-xgc2-ros1-utils
  depends: []
usage:
  install: 'sudo apt update

    sudo apt install ros-melodic-xgc2-ros1-utils

    '
  smoke_test: 'rospack find ros1_utils

    '
ownership:
  paths:
  - /opt/ros/melodic/share/ros1_utils
  - /opt/ros/melodic/include/ros1_utils
