schema: xgc2.product.v1
id: xgc2-ros1-utils
name: XGC2 ROS1 Utils
version: 1.1.1-9
kind: ros1-apt
summary: ROS1-coupled parameter, namespace, and topic quality helpers for XGC2 runtime
  packages.
ros:
  distro: melodic,noetic
  packages:
  - ros1_utils
apt:
  distribution: bionic,focal
  install:
  - ros-noetic-xgc2-ros1-utils
  packages:
  - ros-melodic-xgc2-ros1-utils
  - ros-noetic-xgc2-ros1-utils
  depends: []
usage:
  install: 'sudo apt update

    sudo apt install ros-noetic-xgc2-ros1-utils

    '
  smoke_test: 'rospack find ros1_utils

    '
ownership:
  paths:
  - /opt/ros/noetic/share/ros1_utils
  - /opt/ros/noetic/include/ros1_utils
release:
  apt_versions:
    bionic: 1.1.1-9
    focal: 1.1.1-9
